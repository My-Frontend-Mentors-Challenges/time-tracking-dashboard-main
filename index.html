<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
  <title>Frontend Mentor | Time tracking dashboard</title>


</head>

<body>

  <main>
    <aside>
      <section class="profile">
        <div class="profile-img"><img src="./images/image-jeremy.png" alt="Jeremy image"></div>
        <div class="profile-details">
          <p>Report for</p>
          <h1>Jeremy Robson</h1>
        </div>
      </section>

      <section class="time-controls">
        <button type="button" data-filter="daily">Daily</button>
        <button type="button" data-filter="weekly">Weekly</button>
        <button type="button" data-filter="monthly">Monthly</button>
      </section>
    </aside>
    <ul>
      <li>
        <h2>Work</h2>
        <button type="button"><img src="./images/icon-ellipsis.svg" alt="icon ellipsis"></button>
        <span>32hrs</span>
        <p>Last Week - 36hrs</p>
        <img src="./images/icon-work.svg" alt="">
      </li>
    </ul>
  </main>

</body>

</html>
